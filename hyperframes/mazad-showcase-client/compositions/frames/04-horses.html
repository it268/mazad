  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var card = document.querySelector('.f04-horses-card');
      var shot = document.querySelector('.f04-horses-shotwrap');
      var chips = gsap.utils.toArray('.f04-horses-chip');

      var tl = gsap.timeline({ paused: true });

      /* ---- Scene 1 (0.0-1.4) the browser card seats LEFT; eyebrow + h2
              reveal with it on the right column. Hero visible by ~0.4s. ---- */
      tl.fromTo(card,
        { y: 42, scale: 0.98, autoAlpha: 0, transformOrigin: '50% 60%' },
        { y: 0, scale: 1, autoAlpha: 1, duration: 0.9, ease: 'power3.out' }, 0);
      tl.fromTo('.f04-horses-eyebrow',
        { y: 22, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.6, ease: 'power3.out' }, 0.4);
      tl.fromTo('.f04-horses-h2',
        { y: 26, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.75, ease: 'power3.out' }, 0.55);

      /* ---- the slow push toward the photo cards: starts with Scene 1 and
              rides the inner shot wrapper (never the timed clip) to the end ---- */
      tl.fromTo(shot,
        { scale: 1 },
        { scale: 1.09, transformOrigin: '50% 74%', duration: 4.6, ease: 'power1.inOut' }, 0.4);

      /* ---- Scene 2 (1.4-3.4) the chip cascade: three tinted pills
              spring-pop staggered ~0.35s apart under the h2 ---- */
      chips.forEach(function (chip, i) {
        tl.fromTo(chip,
          { y: 26, scale: 0.55, autoAlpha: 0 },
          { y: 0, scale: 1, autoAlpha: 1, duration: 0.6, ease: 'back.out(1.7)', immediateRender: true },
          1.45 + i * 0.35);
      });

      /* ---- Scene 3 (3.4-5.0) settle: card micro-settles upward while the
              push keeps drifting; chips take one gentle breathing settle.
              All fromTo with explicit from-values — seek-safe, no exit. ---- */
      tl.fromTo(card,
        { y: 0 },
        { y: -6, duration: 1.35, ease: 'power1.inOut', immediateRender: false }, 3.5);
      chips.forEach(function (chip, i) {
        tl.fromTo(chip,
          { y: 0 },
          { y: -3, duration: 0.6, ease: 'sine.inOut', immediateRender: false },
          3.55 + i * 0.08);
        tl.fromTo(chip,
          { y: -3 },
          { y: 0, duration: 0.6, ease: 'sine.inOut', immediateRender: false },
          4.2 + i * 0.08);
      });

      window.__timelines['04-horses'] = tl;
    })();
  </script>
