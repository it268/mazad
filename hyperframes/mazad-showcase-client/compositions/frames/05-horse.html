  <script>
    (function () {
      var card = document.querySelector('.f05-horse-card');
      var shot = document.querySelector('.f05-horse-shotwrap');

      var tl = gsap.timeline({ paused: true });

      /* ---- Scene 1 (0.0-1.8) the ONE restrained move: accent line draws on,
              eyebrow + h2 fade up right, and the browser card slides up +
              crossfades into center. Hero visible by ~0.4s. ---- */
      tl.fromTo('.f05-horse-accentline',
        { scaleX: 0 },
        { scaleX: 1, transformOrigin: 'right center', duration: 0.5, ease: 'power2.out' }, 0.02);
      tl.fromTo('.f05-horse-eyebrow',
        { y: 18, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.6, ease: 'power3.out' }, 0.16);
      tl.fromTo('.f05-horse-h2',
        { y: 22, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.8, ease: 'power3.out' }, 0.3);
      tl.fromTo(card,
        { y: 44, scale: 0.985, autoAlpha: 0 },
        { y: 0, scale: 1, autoAlpha: 1, duration: 1.05, ease: 'power3.out' }, 0.06);

      /* ---- Scene 2 (1.8-3.4) the single tinted line fades up on the right;
              camera micro-drifts toward the photo/specs band — the push rides
              the inner shot wrapper only (never the timed clip). ---- */
      tl.fromTo('.f05-horse-line',
        { y: 16, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.85, ease: 'power2.out' }, 1.85);
      tl.fromTo(shot,
        { scale: 1 },
        { scale: 1.055, transformOrigin: '50% 58%', duration: 1.55, ease: 'sine.inOut' }, 1.85);

      /* ---- Scene 3 (3.4-5.0) deliberate still hold — the allocated stillness
              beat of titlecard-reveal: no second development phase, no exit. ---- */

      window.__timelines['05-horse'] = tl;
    })();
