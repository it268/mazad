  <script>
    (function () {
      var ID = "07-closing";

      function build() {
        if (!window.gsap) return false;
        window.__timelines = window.__timelines || {};
        if (window.__timelines[ID]) return true; // idempotent on double mount

        var el = function (id) { return document.getElementById(id); };
        var cam = el("f07-closing-cam");
        var glow = el("f07-closing-glow");
        var rings = [
          el("f07-closing-ring-a"),
          el("f07-closing-ring-b"),
          el("f07-closing-ring-c")
        ];
        var lockup = el("f07-closing-lockup");
        var rule = el("f07-closing-rule");
        var h2 = el("f07-closing-h2");
        var pill = el("f07-closing-pill");

        var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

        /* ---- macro settle — the whole stage breathes from 1.035 down to 1
                across the shot (settled-reveal allowance: very slow global
                zoom-out, no pan). Ends by 4.2 so the final hold is still. ---- */
        tl.fromTo(cam, { scale: 1.035 }, { scale: 1, duration: 4.2, ease: "power2.out" }, 0);

        /* ---- Scene 1 (0.0-1.4) — atmosphere radiates, lockup settles as ONE
                unit (already-assembled settle variant: it arrives whole) ---- */

        // glow ignites behind the lockup
        tl.fromTo(glow,
          { opacity: 0, scale: 0.72 },
          { opacity: 1, scale: 1, duration: 1.1, ease: "power2.out" }, 0.05);

        // rings pulse outward from the shared center, inner -> outer
        tl.fromTo(rings,
          { scale: 0.66, opacity: 0 },
          { scale: 1, opacity: 1, duration: 1.05, ease: "power2.out", stagger: 0.22 }, 0.12);

        // the lockup (mark + wordmark) settles as one unit: scale 1.04 -> 1.0
        tl.fromTo(lockup,
          { scale: 1.04, y: 12, autoAlpha: 0 },
          { scale: 1, y: 0, autoAlpha: 1, duration: 1.0, ease: "power3.out" }, 0.04);

        // accent-line draws on as the settle lands (end of Scene 1)
        tl.fromTo(rule,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.5, ease: "power2.out" }, 1.02);

        // rings keep a near-imperceptible outward drift through the mid-shot
        // (one long linear micro-tween; all motion stops by 4.0)
        tl.fromTo(rings,
          { scale: 1 },
          { scale: 1.045, duration: 2.4, ease: "none", stagger: 0.15, immediateRender: false }, 1.3);

        /* ---- Scene 2 (1.4-3.0) — the ask fades up ---- */
        tl.fromTo(h2,
          { y: 26, autoAlpha: 0 },
          { y: 0, autoAlpha: 1, duration: 0.85, ease: "power3.out" }, 1.55);

        /* ---- Scene 3 (3.0-4.2) — the one solid element spring-pops ---- */
        tl.fromTo(pill,
          { scale: 0.7, y: 12, autoAlpha: 0 },
          { scale: 1, y: 0, autoAlpha: 1, duration: 0.62, ease: "back.out(1.7)" }, 3.05);

        /* ---- Scene 4 (4.2-5.0) — hold the end card, still. No exit, no
                fade-out: the frame ends on the landed lockup. ---- */

        window.__timelines[ID] = tl;
        return true;
      }

      if (!build()) {
        // gsap CDN still loading (async insertion edge case) — build once it lands
        var s = document.getElementById("f07-closing-gsap");
        if (s) s.addEventListener("load", build);
      }
    })();
