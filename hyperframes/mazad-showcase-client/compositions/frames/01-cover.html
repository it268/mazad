  <script>
    (function () {
      var ID = "01-cover";

      function build() {
        if (!window.gsap) return false;
        window.__timelines = window.__timelines || {};
        if (window.__timelines[ID]) return true; // idempotent on double mount

        var el = function (id) { return document.getElementById(id); };
        var cam = el("f01-cover-cam");
        var glow = el("f01-cover-glow");
        var guideG = el("f01-cover-guide-g");
        var ringO = el("f01-cover-ring-o");
        var ringI = el("f01-cover-ring-i");
        var ticks = [
          el("f01-cover-tick-1"),
          el("f01-cover-tick-2"),
          el("f01-cover-tick-3"),
          el("f01-cover-tick-4")
        ];
        var echo = el("f01-cover-echo");
        var mark = el("f01-cover-mark");
        var word = el("f01-cover-wordmark");
        var rule = el("f01-cover-rule");
        var sub = el("f01-cover-subline");

        var tl = gsap.timeline({ paused: true, defaults: { ease: "power3.out" } });

        /* ---- Scene 1 (0.0-2.2) — the mark comes to exist, center-upper ---- */

        // very slow global zoom-out running under the whole shot (settled-reveal allowance)
        tl.fromTo(cam, { scale: 1.055 }, { scale: 1, duration: 3.4, ease: "power2.out" }, 0);

        // glow ignites
        tl.fromTo(glow,
          { opacity: 0, scale: 0.55 },
          { opacity: 1, scale: 1, duration: 1.0, ease: "power2.out" }, 0.06);

        // construction outline traces (outer ring, inner ring, then cardinal ticks)
        tl.fromTo(ringO,
          { strokeDashoffset: 1232 },
          { strokeDashoffset: 0, duration: 1.05, ease: "power2.inOut" }, 0.22);
        tl.fromTo(ringI,
          { strokeDashoffset: 830 },
          { strokeDashoffset: 0, duration: 0.95, ease: "power2.inOut" }, 0.44);
        tl.fromTo(ticks,
          { strokeDashoffset: 20 },
          { strokeDashoffset: 0, duration: 0.35, ease: "power2.out", stagger: 0.08 }, 0.78);

        // depth layer 1 — blurred echo blooms in behind the mark
        tl.fromTo(echo,
          { opacity: 0, scale: 1.16 },
          { opacity: 0.22, scale: 1.08, duration: 0.8, ease: "power2.out" }, 0.32);

        // fill wipes in (bottom-up) with a spring settle — depth layer 2 (the mark itself over the guides)
        tl.fromTo(mark,
          { clipPath: "inset(100% 0% 0% 0%)" },
          { clipPath: "inset(0% 0% 0% 0%)", duration: 0.9, ease: "power2.inOut" }, 0.42);
        tl.fromTo(mark,
          { scale: 0.94, rotation: 1.4 },
          { scale: 1, rotation: 0, duration: 1.0, ease: "back.out(1.6)" }, 0.46);

        // scaffolding recedes to a faint depth presence once the mark has landed
        tl.fromTo(guideG, { opacity: 1 }, { opacity: 0.32, duration: 0.7, ease: "power2.out" }, 1.62);

        /* ---- Scene 2 (2.2-3.6) — wordmark, then sub-line a half-beat later ---- */
        tl.fromTo(word,
          { opacity: 0, y: 26 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 2.2);
        tl.fromTo(sub,
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 2.68);

        // near-imperceptible continuous scale-up through the hold (blueprint allowance)
        tl.fromTo(mark, { scale: 1 }, { scale: 1.012, duration: 2.3, ease: "none" }, 2.2);

        /* ---- Scene 3 (3.6-4.5) — teal accent-line draws; lockup holds centered, still ---- */
        tl.fromTo(rule,
          { scaleX: 0 },
          { scaleX: 1, duration: 0.55, ease: "power3.out" }, 3.6);

        window.__timelines[ID] = tl;
        return true;
      }

      if (!build()) {
        // gsap CDN still loading (async insertion edge case) — build once it lands
        var s = document.getElementById("f01-cover-gsap");
        if (s) s.addEventListener("load", build);
      }
    })();
