  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var card = document.querySelector('.f06-sell-card');
      var wrap = document.querySelector('.f06-sell-shotwrap');
      var sell = document.querySelector('.f06-sell-shot-sell');
      var account = document.querySelector('.f06-sell-shot-account');
      var ring = document.querySelector('.f06-sell-ring');
      var h2a = document.querySelector('.f06-sell-h2a');
      var h2b = document.querySelector('.f06-sell-h2b');
      var circles = document.querySelectorAll('.f06-sell-circle');
      var numerals = document.querySelectorAll('.f06-sell-num');
      var labels = document.querySelectorAll('.f06-sell-steplabel');

      /* step-circle ladder from the design system: 1.0 → 0.85 → 0.7 */
      var LADDER = [1, 0.85, 0.7];
      var STEP_T = [1.55, 2.4, 3.25]; /* 0.85s cascade */

      var tl = gsap.timeline({ paused: true });

      /* ---- Scene 1 (0.0-1.5) the sell form seats LEFT, caption column
              right: accent line draws on, eyebrow + h2 fade up, browser card
              slides up + crossfades in. Hero visible by ~0.4s. ---- */
      tl.fromTo('.f06-sell-accentline',
        { scaleX: 0 },
        { scaleX: 1, transformOrigin: 'right center', duration: 0.5, ease: 'power2.out' }, 0.02);
      tl.fromTo('.f06-sell-eyebrow',
        { y: 18, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.6, ease: 'power3.out' }, 0.18);
      tl.fromTo(h2a,
        { y: 22, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.8, ease: 'power3.out' }, 0.3);
      tl.fromTo(card,
        { y: 44, scale: 0.985, autoAlpha: 0 },
        { y: 0, scale: 1, autoAlpha: 1, duration: 1.05, ease: 'power3.out' }, 0.06);

      /* ---- macro camera: one slow push across the whole shot, riding the
              inner wrapper only (never the timed clip). ---- */
      tl.fromTo(wrap,
        { scale: 1 },
        { scale: 1.075, transformOrigin: '50% 55%', duration: 8, ease: 'none' }, 0);

      /* ---- Scene 2 (1.5-3.8) three step-circles cascade on 0.85s stagger:
              each pops as an outline, then fills teal as its label lands
              (numeral flips cobalt → cream with the fill). ---- */
      STEP_T.forEach(function (t, i) {
        tl.fromTo(circles[i],
          { scale: 0.5, autoAlpha: 0 },
          { scale: 1, autoAlpha: LADDER[i], duration: 0.42, ease: 'back.out(1.7)' }, t);
        tl.fromTo(labels[i],
          { x: 34, autoAlpha: 0 },
          { x: 0, autoAlpha: LADDER[i], duration: 0.6, ease: 'power2.out' }, t + 0.1);
        tl.fromTo(circles[i],
          { backgroundColor: 'rgba(14,95,130,0)', borderColor: 'rgba(14,95,130,0.2)' },
          { backgroundColor: '#0E5F82', borderColor: '#0E5F82', duration: 0.5, ease: 'power2.inOut' }, t + 0.16);
        tl.fromTo(numerals[i],
          { color: '#0E5F82' },
          { color: '#F6F3EC', duration: 0.5, ease: 'power2.inOut' }, t + 0.16);
      });

      /* ---- Scene 3 (3.8-5.6) THE SWAP: the card's screen cross-dissolves
              in place to the account page — account fades in over the sell
              form with a whisper of settle scale, sell releases underneath.
              The h2 crossfades to the follow-up line in the same beat. ---- */
      tl.fromTo(account,
        { autoAlpha: 0, scale: 1.04 },
        { autoAlpha: 1, scale: 1, transformOrigin: '50% 50%', duration: 0.75, ease: 'power2.inOut' }, 3.85);
      tl.fromTo(sell,
        { autoAlpha: 1 },
        { autoAlpha: 0, duration: 0.65, ease: 'power2.inOut' }, 4.2);
      tl.fromTo(h2a,
        { y: 0, autoAlpha: 1 },
        { y: -16, autoAlpha: 0, duration: 0.55, ease: 'power2.in', immediateRender: false }, 3.9);
      tl.fromTo(h2b,
        { y: 18, autoAlpha: 0 },
        { y: 0, autoAlpha: 1, duration: 0.7, ease: 'power3.out' }, 4.0);

      /* ---- the teal proof ring pops over the live مزايداتي row and pulses
              exactly once — it really exists on the screen. ---- */
      tl.fromTo(ring,
        { autoAlpha: 0, scale: 1.07 },
        { autoAlpha: 1, scale: 1, transformOrigin: '50% 50%', duration: 0.5, ease: 'power3.out' }, 4.78);
      tl.fromTo(ring,
        { scale: 1 },
        { scale: 1.035, duration: 0.3, ease: 'sine.inOut', immediateRender: false }, 5.35);
      tl.fromTo(ring,
        { scale: 1.035 },
        { scale: 1, duration: 0.36, ease: 'sine.out', immediateRender: false }, 5.65);

      /* ---- Scene 4 (5.6-8.0) hold — the account dashboard reads: طلبات
              قيد المراجعة، مزايدات مباشرة، صفقة مؤكدة. No exit: the slow push
              keeps breathing under the still frame until unmount. ---- */

      window.__timelines['06-sell-account'] = tl;
    })();
  </script>
