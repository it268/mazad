      var ring = document.querySelector('.f03-auction-ring');

      var tl = gsap.timeline({ paused: true });

      /* ---- Scene 1 (0.0-2.0) tight full-bleed on the navy bid card;

              One tween, one shared ease, scale 2.5 -> 0.68333 and translate -> 0;
              the world drifts from full-bleed to its home slot (96,60). ---- */

        { scale: 2.5, x: -753.5, y: -460 },
        { scale: 0.6833333, x: 0, y: 0, duration: 3.2, ease: 'power4.out' }, 2.0);

      /* ---- Scene 2 midpoint: margin captions fade up on the right ---- */
