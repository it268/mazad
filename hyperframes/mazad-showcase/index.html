<!doctype html>

    <style>

        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {

        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #F6F3EC;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-cover", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 4.5);
        tl.fromTo("#el-02-home", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 4.5);
        tl.to("#el-02-home", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.fromTo("#el-03-horses", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 10);
        tl.to("#el-03-horses", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 15);
        tl.fromTo("#el-04-auction", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 15);

        tl.fromTo("#el-08-closing", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 39.5);
        tl.to({}, { duration: 44.5 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
