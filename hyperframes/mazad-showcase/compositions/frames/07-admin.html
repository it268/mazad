/* ——— 07-admin · frame styles (Blue Professional tokens) ———
   NOTE: the staged admin screenshots are a failed capture (blank error page),
   so the two admin screens are recreated in HTML inside the browser card,
   styled after the real site's captured design (navy #232867 / orange #e96b0b
   / cream #f6f3ec — sampled from the real page screenshots). Frame chrome
   around the card keeps the Blue Professional tokens. */

#root {
  position: relative;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  font-family: 'Alexandria', sans-serif;
  color: #191510;
  -webkit-font-smoothing: antialiased;
}

#root, #root * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.f07-admin-clip {
  position: absolute;
  inset: 0;
}

/* full-bleed cream ground — dedicated clip, never a background on #root */
.f07-admin-bg {
  background: #F6F3EC;
}

/* scene container = the frame ground container for all cqw/cqh units */
.f07-admin-scene {
  container-type: size;
  overflow: hidden;
}

/* ——— browser card — final layout: card LEFT (~60% width), cream margin
   column RIGHT reserved for the RTL captions. Bottom edge ~831px of 1080,
   inside the 83% caption keep-out. ——— */
.f07-admin-cardzone {
  position: absolute;
  left: 5cqw;
  top: 11.1cqh;
  width: 59.8cqw;
}

.f07-admin-card {
  background: #F6F3EC;
  border: 1.5px solid rgba(14, 95, 130, 0.2);
  border-radius: 14px;
  overflow: hidden;
  will-change: transform;
}

.f07-admin-chrome {
  display: flex;
  align-items: center;
  height: 40px;
  padding: 0 17px;
  background: rgba(14, 95, 130, 0.08);
  border-bottom: 1.5px solid rgba(14, 95, 130, 0.2);
}

.f07-admin-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: rgba(14, 95, 130, 0.25);
  flex: none;
}

.f07-admin-url {
  margin-inline-start: 15px;
  padding: 4px 23px;
  border: 1px solid rgba(14, 95, 130, 0.2);
  border-radius: 100px;
  background: #F6F3EC;
  color: #4C463D;
  font-size: 13.5px;
  font-weight: 500;
  line-height: 1.5;
  white-space: nowrap;
}

/* card window: persistent site chrome (strip + admin bar) never fades;
   only the content viewport cross-dissolves — chrome persists across the
   swap, per the stepwise-flow mechanic */
.f07-admin-window {
  position: relative;
  height: 668px;
  overflow: hidden;
  border-radius: 0 0 12px 12px;
  background: #f2eee3;
}

/* ——— recreated site chrome (real site design, sampled from captures) ——— */
.f07-strip {
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(90deg, #1d4a6e 0%, #232867 58%, #2a3374 100%);
  color: rgba(255, 255, 255, 0.92);
  font-size: 10.5px;
  font-weight: 500;
  white-space: nowrap;
}

.f07-bar {
  height: 54px;
  display: flex;
  align-items: center;
  padding: 0 22px;
  background: #fdfbf6;
  border-bottom: 1px solid #e8e2d4;
}

.f07-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14.5px;
  font-weight: 700;
  color: #232867;
  white-space: nowrap;
}

.f07-brandmark {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: #e96b0b;
  flex: none;
}

.f07-nav {
  display: flex;
  align-items: center;
  gap: 22px;
  margin-inline-start: 34px;
  font-size: 11.5px;
  font-weight: 500;
  color: #8b8577;
  white-space: nowrap;
}

/* active item starts on the dashboard, hands over at the swap beat */
#f07-nav-dash {
  color: #e96b0b;
  font-weight: 700;
}

.f07-admin {
  margin-inline-start: auto;
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 11.5px;
  font-weight: 500;
  color: #6f695c;
  white-space: nowrap;
}

.f07-avatar {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: #232867;
  color: #ffffff;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}

/* ——— content viewport + camera push wrapper ——— */
.f07-viewport {
  position: relative;
  height: 584px;
  overflow: hidden;
}

.f07-push {
  position: absolute;
  inset: 0;
  will-change: transform;
}

.f07-screen {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
  display: block;
}

.f07-screenhead {
  display: flex;
  align-items: flex-start;
}

.f07-screentitle {
  font-size: 20px;
  font-weight: 700;
  line-height: 1.35;
  color: #232867;
}

.f07-screensub {
  margin-top: 2px;
  font-size: 11.5px;
  font-weight: 400;
  line-height: 1.5;
  color: #8b8577;
}

.f07-headbadge {
  margin-inline-start: 14px;
  margin-top: 5px;
  padding: 4px 13px;
  border-radius: 100px;
  background: rgba(233, 107, 11, 0.12);
  color: #c25a08;
  font-size: 10.5px;
  font-weight: 600;
  line-height: 1.5;
  white-space: nowrap;
}

.f07-headpill {
  margin-inline-start: auto;
  margin-top: 5px;
  padding: 4px 15px;
  border: 1px solid #ddd6c8;
  border-radius: 100px;
  background: #ffffff;
  color: #6f695c;
  font-size: 10.5px;
  font-weight: 500;
  line-height: 1.5;
  white-space: nowrap;
}

/* ——— screen A: dashboard — 6 stat cards + latest requests ——— */
.f07-stats {
  margin-top: 18px;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
}

.f07-stat {
  background: #ffffff;
  border: 1px solid #e8e2d4;
  border-radius: 10px;
  padding: 13px 14px 12px;
}

.f07-stat-label {
  font-size: 10.5px;
  font-weight: 500;
  line-height: 1.4;
  color: #8b8577;
  white-space: nowrap;
}

.f07-stat-value {
  margin-top: 5px;
  font-size: 24px;
  font-weight: 700;
  line-height: 1.1;
  color: #232867;
}

.f07-stat-hot .f07-stat-value {
  color: #e96b0b;
}

.f07-panel {
  margin-top: 18px;
  flex: 1;
  min-height: 0;
  background: #ffffff;
  border: 1px solid #e8e2d4;
  border-radius: 12px;
  padding: 14px 20px 10px;
  display: flex;
  flex-direction: column;
}

.f07-panelhead {
  display: flex;
  align-items: center;
  padding-bottom: 9px;
  border-bottom: 1px solid #f0ebdf;
}

.f07-paneltitle {
  font-size: 13px;
  font-weight: 700;
  color: #232867;
}

.f07-panellink {
  margin-inline-start: auto;
  font-size: 10.5px;
  font-weight: 600;
  color: #e96b0b;
}

.f07-minirow {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 11px 0;
  border-bottom: 1px solid #f4f0e6;
  font-size: 11.5px;
  line-height: 1.4;
}

.f07-minirow:last-child {
  border-bottom: none;
}

.f07-mini-name {
  font-size: 12px;
  font-weight: 600;
  color: #232867;
  white-space: nowrap;
}

.f07-mini-seller {
  color: #8b8577;
  white-space: nowrap;
}

.f07-mini-price {
  margin-inline-start: auto;
  font-size: 12px;
  font-weight: 700;
  color: #232867;
  white-space: nowrap;
}

.f07-mini-time {
  color: #a39c8d;
  font-size: 10.5px;
  white-space: nowrap;
}

.f07-minipill {
  flex: none;
  width: 118px;
  text-align: center;
  padding: 4px 0;
  border-radius: 100px;
  background: rgba(233, 107, 11, 0.12);
  color: #c25a08;
  font-size: 10px;
  font-weight: 600;
  white-space: nowrap;
}

.f07-minipill-cool {
  background: rgba(35, 40, 103, 0.08);
  color: #232867;
}

/* site footer strip (real site copy) — pinned to the viewport bottom so both
   screens hold it at the same y across the cross-dissolve */
.f07-sitefoot {
  margin-top: auto;
  padding-top: 9px;
  border-top: 1px solid #e8e2d4;
  text-align: center;
  font-size: 9.5px;
  font-weight: 400;
  color: #a39c8d;
  white-space: nowrap;
}

/* ——— screen B: sale-requests review table ——— */
.f07-table {
  margin-top: 16px;
  background: #ffffff;
  border: 1px solid #e8e2d4;
  border-radius: 12px;
  padding: 6px 20px 8px;
}

.f07-tr {
