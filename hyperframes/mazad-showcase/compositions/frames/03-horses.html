/* ——— 03-horses · frame styles (Blue Professional tokens) ——— */

#root {
  position: relative;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  font-family: 'Alexandria', sans-serif;
  color: #191510;
  -webkit-font-smoothing: antialiased;
}

#root, #root * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.f03-horses-clip {
  position: absolute;
  inset: 0;
}

/* full-bleed cream ground — dedicated clip, never a background on #root */
.f03-horses-bg {
  background: #F6F3EC;
}

/* scene container = the frame ground container for all cqw units */
.f03-horses-scene {
  container-type: size;
}

/* browser card — sits LEFT (~58% width), caption column RIGHT (RTL mirrored split) */
.f03-horses-cardzone {
  position: absolute;
  left: 5cqw;
  top: 9cqh;
  width: 58cqw;
}

.f03-horses-card {
  background: #F6F3EC;
  border: 1.5px solid rgba(14, 95, 130, 0.2);
  border-radius: 14px;
  overflow: hidden;
}

.f03-horses-chrome {
  display: flex;
  align-items: center;
  height: 2cqw;
  padding: 0 0.9cqw;
  background: rgba(14, 95, 130, 0.08);
  border-bottom: 1.5px solid rgba(14, 95, 130, 0.2);
}

.f03-horses-dot {
  width: 0.52cqw;
  height: 0.52cqw;
  border-radius: 50%;
  background: rgba(14, 95, 130, 0.25);
  flex: none;
}

.f03-horses-url {
  margin-inline-start: 0.8cqw;
  padding: 0.22cqw 1.2cqw;
  border: 1px solid rgba(14, 95, 130, 0.2);
  border-radius: 100px;
  background: #F6F3EC;
  color: #4C463D;
  font-size: 0.72cqw;
  font-weight: 500;
  line-height: 1.5;
  white-space: nowrap;
}

/* screenshot window — camera push lives on the inner wrapper only, never the clip */
.f03-horses-window {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 0 0 12px 12px;
}

.f03-horses-shot {
  position: absolute;
  inset: 0;
  transform-origin: 59% 63%; /* aimed at the horse cards row of the browse grid */
}

.f03-horses-shot img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
}

/* caption column — anchored RIGHT (RTL), card LEFT */
.f03-horses-col {
  position: absolute;
  right: 5cqw;
  top: 26cqh;
  width: 24.5cqw;
  text-align: right;
}

.f03-horses-rule {
  width: 60px;
  height: 4px;
  border-radius: 2px;
  background: #0E5F82;
  margin-inline-start: auto;
}

/* Arabic eyebrow: cobalt + weight, no letter-spacing (cursive script must stay joined) */
.f03-horses-eyebrow {
  margin-top: 12px;
  font-size: 0.85cqw;
  font-weight: 600;
  line-height: 1.5;
  color: #0E5F82;
}

.f03-horses-h2 {
  margin-top: 6px;
  font-size: 2.6cqw;
  font-weight: 600;
  line-height: 1.15;
  color: #191510;
}

/* the three cascading tinted chips (grid-card-assemble, overlay adaptation) */
.f03-horses-chips {
  margin-top: 26px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 14px;
}

.f03-horses-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.55cqw;
  padding: 0.5cqw 1.15cqw;
  background: rgba(14, 95, 130, 0.08);
  border: 1.5px solid rgba(14, 95, 130, 0.2);
  border-radius: 100px;
  color: #0E5F82;
  font-size: 1.05cqw;
  font-weight: 500;
  line-height: 1.5;
  white-space: nowrap;
}

.f03-horses-chipdot {
  width: 0.42cqw;
  height: 0.42cqw;
  border-radius: 50%;
  background: #0E5F82;
  flex: none;
}
</style>

<script>
(function () {
  var tl = gsap.timeline({ paused: true });

  /* Scene 1 (0.0–1.4s) — the browser card seats LEFT with a lean settle (slides in,
     decelerating from -2.4deg to its resting -0.8deg lean); the cobalt rule, eyebrow
     "السوق" and h2 "خيل معروضة للبيع" reveal with it on the right column. */
  tl.fromTo("#f03-horses-card",
    { x: -70, y: 36, rotation: -2.4, autoAlpha: 0 },
    { x: 0, y: 0, rotation: -0.8, autoAlpha: 1, duration: 1.0, ease: "power3.out" }, 0.02);
  tl.fromTo("#f03-horses-rule",
    { scaleX: 0 },
    { scaleX: 1, transformOrigin: "100% 50%", duration: 0.55, ease: "power2.out" }, 0.15);
  tl.fromTo("#f03-horses-eyebrow",
    { y: 22, autoAlpha: 0 },
    { y: 0, autoAlpha: 1, duration: 0.6, ease: "power2.out" }, 0.25);
  tl.fromTo("#f03-horses-h2",
    { y: 30, autoAlpha: 0 },
    { y: 0, autoAlpha: 1, duration: 0.75, ease: "power2.out" }, 0.38);

  /* slow push-in phase 1 (0.25–3.4s) — steady 1.0→1.045 camera move toward the horse
     cards row of the grid; inner wrapper only, never the timed clip element. */
  tl.fromTo("#f03-horses-shot",
    { scale: 1 },
    { scale: 1.045, duration: 3.15, ease: "power1.inOut" }, 0.25);

  /* Scene 2 (1.4–3.4s) — the three tinted chips cascade in on their reading beats,
     0.35s apart: spring pop from the inline-start (right) side. */
  tl.fromTo("#f03-horses-chip1",
    { x: 34, scale: 0.55, autoAlpha: 0 },
    { x: 0, scale: 1, autoAlpha: 1, duration: 0.7, ease: "back.out(1.7)" }, 1.45);
  tl.fromTo("#f03-horses-chip2",
    { x: 34, scale: 0.55, autoAlpha: 0 },
    { x: 0, scale: 1, autoAlpha: 1, duration: 0.7, ease: "back.out(1.7)" }, 1.8);
  tl.fromTo("#f03-horses-chip3",
    { x: 34, scale: 0.55, autoAlpha: 0 },
    { x: 0, scale: 1, autoAlpha: 1, duration: 0.7, ease: "back.out(1.7)" }, 2.15);

  /* Scene 3 (3.4–5.0s) — final micro-settle of the push (1.045→1.062, decelerating),
     then the assembled frame holds and reads. No exits: the frame unmounts under
     the root transition. */
  tl.fromTo("#f03-horses-shot",
    { scale: 1.045 },
    { scale: 1.062, duration: 1.3, ease: "power2.out" }, 3.4);

  window.__timelines["03-horses"] = tl;
})();
</script>
