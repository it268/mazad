/* ——— 02-home · frame styles (Blue Professional tokens) ——— */

#root {
  position: relative;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  font-family: 'Alexandria', sans-serif;
  color: #191510;
  -webkit-font-smoothing: antialiased;
}

#root, #root * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.f02-home-clip {
  position: absolute;
  inset: 0;
}

/* full-bleed cream ground — dedicated clip, never a background on #root */
.f02-home-bg {
  background: #F6F3EC;
}

/* scene container = the frame ground container for all cqw units */
.f02-home-scene {
  container-type: size;
}

/* accent backdrop resolving behind the card (device-surface-showcase Scene 1) */
.f02-home-glow {
  position: absolute;
  left: 5cqw;
  top: 9cqh;
  width: 64cqw;
  height: 60cqh;
  background: radial-gradient(ellipse 50% 50% at 50% 50%, rgba(14, 95, 130, 0.09) 0%, rgba(14, 95, 130, 0.04) 45%, rgba(14, 95, 130, 0) 72%);
}

/* browser card — leans LEFT of center (mirrored 60/40), ~62% width */
.f02-home-cardzone {
  position: absolute;
  left: 5cqw;
  top: 8.4cqh;
  width: 62cqw;
}

.f02-home-card {
  background: #F6F3EC;
  border: 1.5px solid rgba(14, 95, 130, 0.2);
  border-radius: 14px;
  overflow: hidden;
}

.f02-home-chrome {
  display: flex;
  align-items: center;
  height: 2cqw;
  padding: 0 0.9cqw;
  background: rgba(14, 95, 130, 0.08);
  border-bottom: 1.5px solid rgba(14, 95, 130, 0.2);
}

.f02-home-dot {
  width: 0.52cqw;
  height: 0.52cqw;
  border-radius: 50%;
  background: rgba(14, 95, 130, 0.25);
  flex: none;
}

.f02-home-url {
  margin-inline-start: 0.8cqw;
  padding: 0.22cqw 1.2cqw;
  border: 1px solid rgba(14, 95, 130, 0.2);
  border-radius: 100px;
  background: #F6F3EC;
  color: #4C463D;
  font-size: 0.72cqw;
  font-weight: 500;
  line-height: 1.5;
  white-space: nowrap;
}

/* screenshot window — camera push lives on the inner wrapper only, never the clip */
.f02-home-window {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 0 0 12px 12px;
}

.f02-home-shot {
  position: absolute;
  inset: 0;
  transform-origin: 66.4% 31.5%; /* aimed at the navy hero headline (خيل العرب الأصيلة) */
}

.f02-home-shot img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
}

/* caption column — anchored RIGHT (mirrored RTL asymmetric split) */
.f02-home-col {
  position: absolute;
  right: 5cqw;
  top: 26cqh;
  width: 24.5cqw;
  text-align: right;
}

.f02-home-rule {
  width: 60px;
  height: 4px;
  border-radius: 2px;
  background: #0E5F82;
  margin-inline-start: auto;
}

.f02-home-eyebrow {
  margin-top: 12px;
  font-size: 0.85cqw;
  font-weight: 600;
  line-height: 1.5;
  color: #0E5F82;
}

.f02-home-h2 {
  margin-top: 6px;
  font-size: 2.6cqw;
  font-weight: 600;
  line-height: 1.15;
  color: #191510;
}

.f02-home-body {
  margin-top: 20px;
  font-size: 1.45cqw;
  font-weight: 400;
  line-height: 1.6;
  color: #4C463D;
}

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var tl = gsap.timeline({ paused: true });

  /* Scene 1 (0.0–1.5s) — the browser card enters as a whole (slide-up + crossfade);
     the accent backdrop resolves behind it. The right column (eyebrow + h2) is
     already seated — static by design, only the card moves. */
  tl.fromTo("#f02-home-glow",
    { opacity: 0 },
    { opacity: 1, duration: 1.2, ease: "power1.out" }, 0.1);
  tl.fromTo("#f02-home-card",
    { y: 46, autoAlpha: 0 },
    { y: 0, autoAlpha: 1, duration: 0.95, ease: "power3.out" }, 0.05);

  /* floating-window idle float — one subtle drift on the card, ending before the hold */
  tl.fromTo("#f02-home-card",
    { y: 0 },
    { y: -6, duration: 3.0, ease: "sine.inOut" }, 1.0);

  /* Scene 2 (1.5–4.0s) — slow 1.0→1.06 camera push-in toward the navy hero headline
     (inner wrapper only, never the timed clip); the muted body line fades up on its beat. */
  tl.fromTo("#f02-home-shot",
    { scale: 1 },
    { scale: 1.06, duration: 2.5, ease: "power1.inOut" }, 1.5);
  tl.fromTo("#f02-home-body",
    { y: 26, autoAlpha: 0 },
    { y: 0, autoAlpha: 1, duration: 0.85, ease: "power2.out" }, 2.05);

  /* Scene 3 (4.0–5.5s) — push at rest; card and text hold and read. Stillness.
     No exits: the frame unmounts under the root transition. */

  window.__timelines["02-home"] = tl;
})();
</script>
