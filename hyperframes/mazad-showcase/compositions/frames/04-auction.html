/* ——— 04-auction · frame styles (Blue Professional tokens) ——— */

#root {
  position: relative;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  font-family: 'Alexandria', sans-serif;
  color: #191510;
  -webkit-font-smoothing: antialiased;
}

#root, #root * {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

.f04-auction-clip {
  position: absolute;
  inset: 0;
}

/* full-bleed cream ground — dedicated clip, never a background on #root */
.f04-auction-bg {
  background: #F6F3EC;
}

/* scene container = the frame ground container for all cqw units;
   overflow hidden crops the magnified world during the zoom-out */
.f04-auction-scene {
  container-type: size;
  overflow: hidden;
}

/* ——— the world (zoom-out-workspace-reveal): the WHOLE room authored at final
   layout from frame 0; the camera (scale + translate) lives on this inner
   wrapper only — never on the timed clip element — with transform-origin 0 0
   so the viewport-change math (T = screenCenter − focal × S) holds exactly. ——— */
.f04-auction-world {
  position: absolute;
  inset: 0;
  will-change: transform;
}

/* browser card — final wide layout: card LEFT (~72.5% width), cream margin
   column RIGHT reserved for the RTL captions. Bottom edge ~81.6% of frame,
   inside the 83% caption keep-out. */
.f04-auction-cardzone {
  position: absolute;
  left: 2.5cqw;
  top: 5.2cqh;
  width: 72.5cqw;
}

.f04-auction-card {
  background: #F6F3EC;
  border: 1.5px solid rgba(14, 95, 130, 0.2);
  border-radius: 14px;
  overflow: hidden;
}

.f04-auction-chrome {
  display: flex;
  align-items: center;
  height: 2.1cqw;
  padding: 0 0.9cqw;
  background: rgba(14, 95, 130, 0.08);
  border-bottom: 1.5px solid rgba(14, 95, 130, 0.2);
}

.f04-auction-dot {
  width: 0.52cqw;
  height: 0.52cqw;
  border-radius: 50%;
  background: rgba(14, 95, 130, 0.25);
  flex: none;
}

.f04-auction-url {
  margin-inline-start: 0.8cqw;
  padding: 0.22cqw 1.2cqw;
  border: 1px solid rgba(14, 95, 130, 0.2);
  border-radius: 100px;
  background: #F6F3EC;
  color: #4C463D;
  font-size: 0.72cqw;
  font-weight: 500;
  line-height: 1.5;
  white-space: nowrap;
}

.f04-auction-window {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  overflow: hidden;
  border-radius: 0 0 12px 12px;
}

.f04-auction-shot {
  position: absolute;
  inset: 0;
}

.f04-auction-shot img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center top;
}

/* teal highlight ring — WORLD-SPACE overlay so it stays glued to the
   165,000 ر.س. figure while the camera moves. Measured on the asset:
   price figure sits at native (648–895, 243–293) of the 1920×1080
   screenshot; the screenshot renders at scale 0.72344 from stage
   (49.5, 98) → ring box stage (498, 269.5) 217×51. */
.f04-auction-ring {
  position: absolute;
  left: 498px;
  top: 269.5px;
  width: 217px;
  height: 51px;
  overflow: visible;
  pointer-events: none;
}

/* caption column — anchored RIGHT (RTL margin captions) */
.f04-auction-col {
  position: absolute;
  right: 2.5cqw;
  top: 23.1cqh;
  width: 21cqw;
  text-align: right;
}

.f04-auction-rule {
  width: 60px;
  height: 4px;
  border-radius: 2px;
  background: #0E5F82;
}

/* Arabic eyebrow: cobalt + weight, no letter-spacing (cursive script must stay joined) */
.f04-auction-eyebrow {
  margin-top: 14px;
  font-size: 1.46cqw;
  font-weight: 600;
  line-height: 1.5;
  color: #0E5F82;
}

.f04-auction-h2 {
  margin-top: 8px;
  font-size: 2.6cqw;
  font-weight: 600;
  line-height: 1.22;
  color: #191510;
}

/* payoff caption card — tinted card (4% fill / 20% border / 14px radius,
   no shadow), bottom-right of the frame, inside the keep-out */
.f04-auction-payoff {
  position: absolute;
  right: 2.5cqw;
  top: 51.9cqh;
  width: 21cqw;
  background: rgba(14, 95, 130, 0.04);
  border: 1.5px solid rgba(14, 95, 130, 0.2);
  border-radius: 14px;
  padding: 1.25cqw 1.45cqw;
  display: flex;
  flex-direction: column;
  gap: 0.73cqw;
}

.f04-auction-row {
  display: flex;
  align-items: center;
  gap: 0.7cqw;
  font-size: 1.41cqw;
  font-weight: 500;
  line-height: 1.5;
  color: #4C463D;
}

.f04-auction-check {
  flex: none;
}
