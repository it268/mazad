  overflow:hidden;
  container-type:size;
  font-family:'Alexandria',sans-serif;
  color:#191510;

/* full-bleed cream ground — dedicated clip layer, never a background on #root */
[id="04-horses-bg"]{background:#F6F3EC;}

[id="04-horses-scene"]{
  display:flex;
  flex-direction:column;
  align-items:center;
  padding-top:14.5cqw; /* top 8% caption keep-out (154px) — content starts just below it */

}

  margin:0;
  font-size:7.2cqw;
  font-weight:700;
  line-height:1.18;
  letter-spacing:-0.01em;
  color:#191510;
}

  margin-top:3.6cqw;

  background:#191510;
}
/* the inner screenshot wrapper — the ONLY element the slow push acts on (never the timed clip) */
[id="04-horses-shot"]{
  position:absolute;
  inset:0;
  transform-origin:50% 39%; /* pivot at the horse photo card's center in the image */
  will-change:transform;
}
[id="04-horses-img"]{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

  height:26px;
  border-radius:100px;
  background:#191510;
}

<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script>
(function () {
  var shot = document.getElementById('04-horses-shot');
  var eyebrow = document.getElementById('04-horses-eyebrow');
  var rule = document.getElementById('04-horses-rule');
  var title = document.getElementById('04-horses-title');
  var phone = document.getElementById('04-horses-phone');
  var chipA = document.getElementById('04-horses-chip-a');
  var chipB = document.getElementById('04-horses-chip-b');

  var tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

  /* Scene 1 (0.0-1.4) — headline seats at top line-by-line, then the phone
     assembles directly into its centered slot (fade + short slide/scale). */
  tl.fromTo(eyebrow, { y: 18, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5 }, 0.05);
  tl.fromTo(rule,
    { scaleX: 0, transformOrigin: '50% 50%' },
    { scaleX: 1, duration: 0.45, ease: 'power2.out' }, 0.18);
  tl.fromTo(title, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.65 }, 0.28);
  tl.fromTo(phone,
    { y: 64, opacity: 0, scale: 0.97 },
    { y: 0, opacity: 1, scale: 1, duration: 0.85 }, 0.2);

  /* THE slow push toward the cards — steady-push camera on the screenshot wrapper
     only (multi-phase-camera "steady push": neutral -> slight push -> more push),
     pivoted on the horse photo card. Phase 1: 0.55-2.4. */
  tl.fromTo(shot,
    { scale: 1 },
    { scale: 1.07, duration: 1.85, ease: 'power2.out' }, 0.55);
  /* Phase 2: 2.4-4.95 — continuous forward momentum under the hold. */
  tl.fromTo(shot,
    { scale: 1.07 },
    { scale: 1.15, duration: 2.55, ease: 'power1.inOut' }, 2.4);

  /* Scene 2 (1.4-3.4) — two trust chips stagger into their slots below the phone. */
  tl.fromTo(chipA, { y: 26, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.6 }, 1.5);
  tl.fromTo(chipB, { y: 26, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.6 }, 1.78);

  /* Scene 3 (3.4-5.0) — chips settled, hold and read; push phase 2 keeps the
     camera drifting in underneath. No exits. */

  window.__timelines['04-horses'] = tl;
})();
</script>
