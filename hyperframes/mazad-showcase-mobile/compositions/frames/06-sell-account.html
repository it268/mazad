<script>
(function () {
  var el = function (s) { return document.getElementById('06-sell-account-' + s); };
  var phone = el('phone');
  var shot = el('shot');
  var imgB = el('img-b');
  var ring = el('ring');

  var tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

  /* Scene 1 (0.0-1.5) — headline seats at top; the phone (sell form on screen) enters. */

  tl.fromTo(rule,
    { scaleX: 0, transformOrigin: '50% 50%' },

  tl.fromTo(titleA, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7 }, 0.2);

  /* the slow push — inner wrapper only, one continuous drift across the whole shot

  /* Scene 2 (1.5-3.8) — three step-circles cascade (0.8s stagger), filling teal with their labels. */

    tl.fromTo(s.fill, { scale: 0, transformOrigin: '50% 50%' }, { scale: 1, duration: 0.5, ease: 'power2.inOut' }, t + 0.18);
    tl.fromTo(s.num, { color: '#0E5F82' }, { color: '#F6F3EC', duration: 0.35, ease: 'power2.out' }, t + 0.42);
    tl.fromTo(s.label, { y: 16, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55 }, t + 0.25);
  });

  /* Scene 3 (3.8-5.6) — THE signature: in-place cross-dissolve, same phone geometry;
     h1 crossfades to the account line; teal ring draws once around the مزايداتي rows and pulses once. */

    { opacity: 0, scale: 1.02, transformOrigin: '50% 40%' },
    { opacity: 1, scale: 1, duration: 0.9, ease: 'power2.inOut' }, 3.8);
  tl.fromTo(titleA, { opacity: 1, y: 0 }, { opacity: 0, y: -20, duration: 0.7, ease: 'power2.in', immediateRender: false }, 3.85);
  tl.fromTo(titleB, { opacity: 0, y: 22 }, { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out' }, 4.0);
  tl.fromTo(ringShape,
    { strokeDashoffset: 100.5 },
    { strokeDashoffset: 0, duration: 0.7, ease: 'power2.inOut' }, 4.55);
  tl.fromTo(ring, { opacity: 1, scale: 1, transformOrigin: '50% 33%' }, { opacity: 0.5, scale: 1.045, duration: 0.5, ease: 'power2.inOut' }, 5.3);
  tl.fromTo(ring, { opacity: 0.5, scale: 1.045, transformOrigin: '50% 33%' }, { opacity: 0.42, scale: 1.02, duration: 0.45, ease: 'power2.out', immediateRender: false }, 5.8);
