<script>
(function () {
  var root = document.querySelector('[data-composition-id="01-cover"]');
  if (!root || typeof gsap === 'undefined') { return; }
  var DUR = 4.5;

  /* --- construction guides: measured stroke-draw setup (svg-path-draw) --- */
  var guides = Array.prototype.slice.call(root.querySelectorAll('.fc01-construction .fc01-g'));
  guides.forEach(function (p) {
    var len = p.getTotalLength() * 1.02;
    p.style.strokeDasharray = String(len);
    p.style.strokeDashoffset = String(len);
  });

  var mark = root.querySelector('.fc01-mark');
  var markImg = root.querySelector('.fc01-mark-img');
  var halo = root.querySelector('.fc01-mark-halo');
  var wordmark = root.querySelector('.fc01-wordmark');
  var subline = root.querySelector('.fc01-subline');
  var accent = root.querySelector('.fc01-accentline');
  var pattern = root.querySelector('.fc01-bg-pattern');

  var tl = gsap.timeline({ paused: true });

  /* glow envelope on the brand mark (asr-keyword-glow mechanics, single linear driver) */
  var GLOW = { start: 0.12, end: 1.2, attack: 0.25, release: 0.85, rest: 0.22 };
  function env(t) {
    if (t < GLOW.start) { return 0; }
    if (t < GLOW.end) { return Math.min((t - GLOW.start) / GLOW.attack, 1); }
    var relEnd = GLOW.end + GLOW.release;
    if (t < relEnd) { return 1 - ((t - GLOW.end) / GLOW.release) * (1 - GLOW.rest); }
    return GLOW.rest;
  }
  var driver = { t: 0 };
  tl.to(driver, {
    t: DUR, duration: DUR, ease: 'none',
    onUpdate: function () {
      halo.style.opacity = env(driver.t).toFixed(3);
    }
  }, 0);

  /* --- Scene 1 (0.0-2.2s): the mark comes to exist --- */

  tl.to(guides.slice(2), { strokeDashoffset: 0, duration: 0.22, ease: 'power2.out', stagger: 0.06 }, 1.1); // corner ticks

  /* fill wipe — clip-path inset reveal, top-to-bottom */
  tl.fromTo(markImg,
    { clipPath: 'inset(0px 0px 100% 0px)' },
    { clipPath: 'inset(0px 0px 0% 0px)', duration: 0.78, ease: 'power2.inOut' }, 0.35);

  /* spring settle — calm long-tail settle, no overshoot (premium register) */
  tl.fromTo(mark,
    { scale: 1.055, y: 12 },
    { scale: 1, y: 0, duration: 0.7, ease: 'power3.out' }, 1.3);

  /* scaffolding clears once the mark stands (mid-shot clear, not an exit) */
  tl.to(root.querySelector('.fc01-construction'), { opacity: 0, duration: 0.55, ease: 'power1.out' }, 1.45);

  /* --- Scene 2 (2.2-3.6s): wordmark fades up; sub-line half a beat later --- */
  tl.fromTo(wordmark,
    { y: 36, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.7, ease: 'power3.out' }, 2.2);
  tl.fromTo(subline,
    { y: 28, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.7, ease: 'power3.out' }, 2.52);

  /* --- Scene 3 (3.6-4.5s): teal accent-line draws, then hold still --- */
  tl.fromTo(accent,
    { scaleX: 0 },
    { scaleX: 1, duration: 0.45, ease: 'power2.out' }, 3.6);

  /* slow macro drift on the pattern beneath, full duration */
  tl.fromTo(pattern,
    { scale: 1 },
    { scale: 1.045, duration: DUR, ease: 'none' }, 0);

  window.__timelines = window.__timelines || {};
  window.__timelines['01-cover'] = tl;
})();
