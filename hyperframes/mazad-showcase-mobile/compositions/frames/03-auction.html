<script>
(function () {
  var shot = document.getElementById('03-auction-shot');
  var ring = document.getElementById('03-auction-ring-shape');
  var eyebrow = document.getElementById('03-auction-eyebrow');
  var rule = document.getElementById('03-auction-rule');
  var title = document.getElementById('03-auction-title');
  var chipA = document.getElementById('03-auction-chip-a');
  var chipB = document.getElementById('03-auction-chip-b');

  var tl = gsap.timeline({ paused: true, defaults: { ease: 'power3.out' } });

  /* Scene 1 (0.0-2.0) — phone centered, tight macro crop on the navy price block
     (screenshot wrapper held at scale 1.8 by the zoom tween's from-state below);
     the detail performs: focus resolve, then the teal ring draws ONCE around 170,000 and eases away. */
  tl.fromTo(shot,
    { filter: 'blur(10px)' },
    { filter: 'blur(0px)', duration: 0.7, ease: 'power2.out' }, 0);
  tl.fromTo(ring,
    { strokeDashoffset: 100.5 },
    { strokeDashoffset: 0, duration: 0.7, ease: 'power2.inOut' }, 0.35);
  tl.fromTo(ring,
    { opacity: 1, attr: { rx: 218 } },
    { opacity: 0, attr: { rx: 236 }, duration: 0.6, ease: 'power2.in' }, 1.45);

  /* Scene 2 (2.0-5.0) — THE one continuous decelerating zoom-out inside the screen (1.8x -> 1.0x).
     One tween, one shared ease (power4.out); scale -> 1 AND translate -> 0, so the price drifts
     from frame-center to its home slot as the full screen (bid form + feed) takes over. */
  tl.fromTo(shot,
    { scale: 1.8, x: -69.7, y: 146 },
    { scale: 1, x: 0, y: 0, duration: 3.0, ease: 'power4.out' }, 2.0);

  /* headline fades up at the midpoint, on the settling wide */
  tl.fromTo(eyebrow, { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6 }, 3.9);
  tl.fromTo(rule,
    { scaleX: 0, transformOrigin: '50% 50%' },
    { scaleX: 1, duration: 0.5, ease: 'power2.out' }, 4.05);
  tl.fromTo(title, { y: 34, opacity: 0 }, { y: 0, opacity: 1, duration: 0.65 }, 4.1);

  /* Scene 3 (5.0-6.4) — two payoff chips stagger in below the phone */
  tl.fromTo(chipA, { y: 28, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.6 }, 5.05);
  tl.fromTo(chipB, { y: 28, opacity: 0, scale: 0.96 }, { y: 0, opacity: 1, scale: 1, duration: 0.6 }, 5.3);

  /* Scene 4 (6.4-8.0) — hold; the screen reads still. No camera tweens after the lock, no exits. */

  window.__timelines['03-auction'] = tl;
})();
</script>
