(function () {

  var ask = root.querySelector('.fc07-ask');

    { y: 30, opacity: 0 },
    { y: 0, opacity: 1, duration: 0.9, ease: 'power3.out' }, 1.6);

  /* --- Scene 3 (2.8-3.8s): the one solid teal CTA pill spring-pops (spring-pop-entrance) --- */

    { scale: 1, opacity: 1, duration: 0.7, ease: 'back.out(1.8)' }, 2.85);
