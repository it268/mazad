<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #F6F3EC;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="40.5"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="el-01-cover"
        class="scene"
        data-composition-id="01-cover"
        data-composition-src="compositions/frames/01-cover.html"
        data-start="0"
        data-duration="5.1"
        data-track-index="0"
      ></div>

      <div
        id="el-02-home"
        class="scene"
        data-composition-id="02-home"
        data-composition-src="compositions/frames/02-home.html"
        data-start="4.5"
        data-duration="6.1"
        data-track-index="1"
      ></div>

      <div
        id="el-03-auction"
        class="scene"
        data-composition-id="03-auction"
        data-composition-src="compositions/frames/03-auction.html"
        data-start="10"
        data-duration="8.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-horses"
        class="scene"
        data-composition-id="04-horses"
        data-composition-src="compositions/frames/04-horses.html"
        data-start="18"
        data-duration="5.6"
        data-track-index="1"
      ></div>

      <div
        id="el-05-horse"
        class="scene"
        data-composition-id="05-horse"
        data-composition-src="compositions/frames/05-horse.html"
        data-start="23"
        data-duration="5.5"
        data-track-index="0"
      ></div>

      <div
        id="el-06-sell-account"
        class="scene"
        data-composition-id="06-sell-account"
        data-composition-src="compositions/frames/06-sell-account.html"
        data-start="28"
        data-duration="8.6"
        data-track-index="1"
      ></div>

      <div
        id="el-07-closing"
        class="scene"
        data-composition-id="07-closing"
        data-composition-src="compositions/frames/07-closing.html"
        data-start="36"
        data-duration="4.5"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-cover", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 4.5);
        tl.fromTo("#el-02-home", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 4.5);
        tl.to("#el-02-home", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.6, ease: "power3.in" }, 10);
        tl.fromTo("#el-03-auction", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "power3.out" }, 10);
        tl.to("#el-03-auction", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 18);
        tl.fromTo("#el-04-horses", { y: 1920, opacity: 1 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 18);
        tl.to("#el-04-horses", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 23);
        tl.fromTo("#el-05-horse", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 23);
        tl.to("#el-05-horse", { y: -1920, duration: 0.5, ease: "power3.inOut" }, 28);
        tl.fromTo("#el-06-sell-account", { y: 1920, opacity: 1 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.inOut" }, 28);
        tl.to("#el-06-sell-account", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 36);
        tl.fromTo("#el-07-closing", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 36);
        tl.to({}, { duration: 40.5 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
