services:
  pocketbase:
    build: ./pocketbase
    restart: unless-stopped
    expose:
      - "8090"
    volumes:
      - pb_data:/pb/pb_data
    environment:
      - PB_SUPERUSER_EMAIL=${PB_SUPERUSER_EMAIL}
      - PB_SUPERUSER_PASSWORD=${PB_SUPERUSER_PASSWORD}
      - PB_ADMIN_PHONE=${PB_ADMIN_PHONE}
      - PB_ADMIN_PASSWORD=${PB_ADMIN_PASSWORD}
    labels:
      - traefik.enable=true
      - traefik.http.routers.mazad-api.rule=Host(`mazad-api.alfrusiyaar.com`)
      - traefik.http.routers.mazad-api.entrypoints=https
      - traefik.http.routers.mazad-api.tls.certresolver=letsencrypt
      - traefik.http.routers.mazad-api.service=mazad-api
      - traefik.http.services.mazad-api.loadbalancer.server.port=8090
      - traefik.http.routers.mazad-api-http.rule=Host(`mazad-api.alfrusiyaar.com`)
      - traefik.http.routers.mazad-api-http.entrypoints=http
      - traefik.http.routers.mazad-api-http.service=mazad-api
      - traefik.http.routers.mazad-api-http.middlewares=mazad-redirect
      - traefik.http.middlewares.mazad-redirect.redirectscheme.scheme=https

  web:
    build:
      context: .
      args:
        VITE_PB_URL: ${VITE_PB_URL:-https://mazad-api.alfrusiyaar.com}
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PB_INTERNAL_URL=http://pocketbase:8090
    depends_on:
      pocketbase:
        condition: service_healthy
    labels:
      - traefik.enable=true
      - traefik.http.routers.mazad-web.rule=Host(`mazad.alfrusiyaar.com`)
      - traefik.http.routers.mazad-web.entrypoints=https
      - traefik.http.routers.mazad-web.tls.certresolver=letsencrypt
      - traefik.http.routers.mazad-web.service=mazad-web
      - traefik.http.services.mazad-web.loadbalancer.server.port=3000
      - traefik.http.routers.mazad-web-http.rule=Host(`mazad.alfrusiyaar.com`)
      - traefik.http.routers.mazad-web-http.entrypoints=http
      - traefik.http.routers.mazad-web-http.service=mazad-web
      - traefik.http.routers.mazad-web-http.middlewares=mazad-redirect

volumes:
  pb_data:
